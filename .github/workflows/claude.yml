name: Claude Code

on:
  # Issue and PR conversation comments share issue_comment. Inline PR review
  # comments use pull_request_review_comment.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
    
permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    # GitHub still creates a workflow run for matching event types. Skip the
    # expensive Claude step unless a human explicitly asks for it. Requiring
    # a User sender also prevents bot replies containing @claude from looping.
    if: |
      github.event.sender.type == 'User' &&
      (
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' &&
         contains(github.event.issue.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: "https://dashscope.aliyuncs.com/apps/anthropic"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model deepseek-v4-flash"
