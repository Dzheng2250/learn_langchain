version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: learn_agent_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learn_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learn_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: