[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-langchain-agent"
version = "0.1.0"
description = "A local LangChain and LangGraph learning agent"
requires-python = ">=3.11"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "psycopg[binary,pool]",
    "python-dotenv",
]

[project.scripts]
learn-agent = "src.core.agent.runtime:run_agent_loop"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.unittest]
start-directory = "tests"
