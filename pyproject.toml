[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-langchain-agent"
version = "0.1.0"
description = "A local LangChain and LangGraph learning agent"
requires-python = ">=3.11"
dependencies = [
    "langchain-core",
    "langchain-anthropic",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic>=2",
    "psycopg[binary,pool]",
    "sqlparse",
    "python-dotenv",
    "platformdirs",
    "textual>=8.0",
    "rich>=13.0",
    "dependency-injector",
    "bashlex>=0.18",
    "tenacity>=8.2",
]

[project.scripts]
learn-agent = "src.cli.main:main"
learn-agent-core = "src.core.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.core.database" = ["sql/*.sql"]
"src.core.state" = ["schema.sql"]

[tool.unittest]
start-directory = "tests"
